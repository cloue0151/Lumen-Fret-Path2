<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Fret Path - Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background-color: #F7F5FC;
        color: #4B3F72;
        font-family: "Montserrat", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Top Navigation Bar */
    .navbar {
        background: #ffffff;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        border-bottom: 1px solid #EBE5F5;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .brand-logo {
        display: flex;
        align-items: center;
    }

    .brand-logo img {
        height: 36px;
        width: auto;
        display: block;
    }

    .nav-center-pill {
        display: flex;
        align-items: center;
        background: #F7F5FC;
        padding: 4px;
        border-radius: 30px;
        gap: 4px;
    }

    .nav-link {
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        color: #7A6F9B;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        border: none;
        background: transparent;
        display: inline-block;
        text-align: center;
    }

    .nav-link:hover {
        color: #4B3F72;
        transform: translateY(-1px);
    }

    .nav-link.active {
        background: #4B3F72;
        color: #ffffff;
        font-weight: 600;
        box-shadow: 0 2px 6px rgba(75, 63, 114, 0.2);
    }

    .nav-right {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    .action-btn {
        background: #4B3F72;
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn:hover {
        background: #393056;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(75,63,114,0.25);
    }

    /* Main Content Area */
    .main-content {
        padding: 36px 32px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        flex: 1;
        opacity: 0;
        transform: translateX(0);
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-content.page-loaded {
        opacity: 1;
        transform: translateX(0);
    }

    .community-layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 32px;
        align-items: start;
    }

    /* Profile Sidebar Card */
    .profile-card {
        background: #ffffff;
        border: 1px solid #EBE5F5;
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 2px 10px rgba(75,63,114,0.02);
        position: sticky;
        top: 104px;
    }

    .profile-picture {
        width: 90px;
        height: 90px;
        background-color: #F7F5FC;
        border-radius: 50%;
        cursor: pointer;
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #7A6F9B;
        border: 2px dashed #B89AE8;
        margin-bottom: 16px;
        overflow: hidden;
        transition: border-color 0.2s ease;
    }

    .profile-picture:hover {
        border-color: #4B3F72;
    }

    .profile-picture img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .profile-name {
        width: 100%;
        text-align: center;
        color: #4B3F72;
        font-size: 16px;
        font-weight: 700;
        border: none;
        background: transparent;
        outline: none;
        margin-bottom: 6px;
    }

    .profile-bio-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
    }

    .profile-bio {
        width: 100%;
        text-align: center;
        color: #7A6F9B;
        font-size: 13px;
        line-height: 1.4;
        word-break: break-word;
    }

    .profile-bio-input {
        width: 100%;
        height: 60px;
        border: 1px solid #B89AE8;
        border-radius: 10px;
        padding: 8px;
        font-size: 12px;
        resize: none;
        outline: none;
        display: none;
        font-family: inherit;
    }

    .bio-btn {
        background-color: #F7F5FC;
        color: #4B3F72;
        border: 1px solid #EBE5F5;
        border-radius: 12px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .bio-btn:hover {
        background-color: #B89AE8;
        color: #ffffff;
    }

    /* Feed Area */
    .feed-container {
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .feed-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
    }

    .search-bar {
        position: relative;
        flex: 1;
        max-width: 400px;
    }

    .search-bar input {
        width: 100%;
        height: 42px;
        background-color: #ffffff;
        border: 1px solid #EBE5F5;
        border-radius: 20px;
        padding: 0 20px 0 42px;
        font-size: 14px;
        color: #4B3F72;
        outline: none;
        box-shadow: 0 2px 6px rgba(75,63,114,0.02);
        transition: border-color 0.2s ease;
    }

    .search-bar input:focus {
        border-color: #B89AE8;
    }

    .search-bar-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        border: 2px solid #B89AE8;
        border-radius: 50%;
    }

    .search-bar-icon::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 2px;
        background-color: #B89AE8;
        right: -5px;
        bottom: -3px;
        transform: rotate(45deg);
        border-radius: 2px;
    }

    /* Posts Grid & Cards */
    .posts {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .post-box {
        width: 100%;
        background-color: #ffffff;
        border: 1px solid #EBE5F5;
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 2px 10px rgba(75,63,114,0.02);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .post-box:hover {
        box-shadow: 0 6px 16px rgba(75,63,114,0.06);
    }

    .post-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .post-author {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .post-author-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background-color: #F7F5FC;
        background-size: cover;
        background-position: center;
        border: 1px solid #B89AE8;
    }

    .post-author-name {
        font-weight: 700;
        color: #4B3F72;
        font-size: 15px;
    }

    .post-caption {
        font-size: 14px;
        color: #5D537B;
        line-height: 1.5;
        word-break: break-word;
    }

    .post-media-container {
        width: 100%;
        max-height: 400px;
        border-radius: 14px;
        overflow: hidden;
        background: #F7F5FC;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .post-media-container img {
        width: 100%;
        height: auto;
        max-height: 400px;
        object-fit: cover;
    }

    .delete-post-btn {
        background-color: #fff5f5;
        color: #e53e3e;
        border: 1px solid #fed7d7;
        padding: 6px 12px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        transition: background-color 0.2s ease;
    }

    .delete-post-btn:hover {
        background-color: #ffe3e3;
    }

    /* Messenger Floating Widget */
    .messenger-widget {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 340px;
        height: 460px;
        background-color: #ffffff;
        border: 1px solid #EBE5F5;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 12px 30px rgba(75,63,114,0.12);
        z-index: 90;
        overflow: hidden;
    }

    .messenger-widget.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
        z-index: 200;
    }

    .messenger-header {
        background-color: #F7F5FC;
        padding: 16px 20px;
        font-weight: 700;
        color: #4B3F72;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #EBE5F5;
    }

    .messenger-header-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        color: #7A6F9B;
        cursor: pointer;
    }

    .users-list {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        max-height: 150px;
        border-bottom: 1px solid #EBE5F5;
        background: #F7F5FC;
    }

    .user-item {
        padding: 10px 16px;
        cursor: pointer;
        border-bottom: 1px solid #EBE5F5;
        font-size: 13px;
        font-weight: 500;
        color: #5D537B;
        transition: background 0.15s ease;
    }

    .user-item:hover {
        background-color: #EBE5F5;
    }

    .user-item.active-user {
        background-color: #B89AE8;
        color: #ffffff;
        font-weight: 600;
    }

    .users-loading {
        padding: 12px;
        text-align: center;
        font-size: 13px;
        color: #7A6F9B;
    }

    .messenger-body {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: 13px;
        position: relative;
        background: #ffffff;
    }

    .msg-wrapper {
        display: flex;
        flex-direction: column;
        max-width: 75%;
        position: relative;
    }

    .msg-incoming { align-self: flex-start; }
    .msg-outgoing { align-self: flex-end; }

    .msg-bubble {
        padding: 10px 14px;
        border-radius: 14px;
        word-break: break-word;
        cursor: pointer;
        user-select: none;
    }

    .msg-incoming .msg-bubble {
        background-color: #F7F5FC;
        color: #4B3F72;
    }

    .msg-outgoing .msg-bubble {
        background-color: #4B3F72;
        color: white;
    }

    .msg-popover {
        position: absolute;
        top: 50%;
        left: -120px;
        transform: translateY(-50%);
        background-color: #ffffff;
        border: 1px solid #EBE5F5;
        border-radius: 10px;
        box-shadow: 0 4px 12px rgba(75,63,114,0.1);
        display: flex;
        flex-direction: column;
        z-index: 100;
        overflow: hidden;
    }

    .msg-popover button {
        background: none;
        border: none;
        padding: 8px 14px;
        font-size: 12px;
        color: #e53e3e;
        font-weight: 600;
        cursor: pointer;
        text-align: left;
    }

    .msg-popover button:hover {
        background-color: #fff5f5;
    }

    .messenger-input-area {
        display: flex;
        padding: 12px;
        border-top: 1px solid #EBE5F5;
        background-color: #F7F5FC;
        gap: 8px;
    }

    .messenger-input-area input {
        flex: 1;
        border: 1px solid #B89AE8;
        border-radius: 20px;
        padding: 8px 14px;
        outline: none;
        font-size: 13px;
        background: white;
        color: #4B3F72;
    }

    .messenger-input-area button {
        background-color: #4B3F72;
        color: white;
        border: none;
        border-radius: 20px;
        padding: 8px 16px;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
    }

    /* Modal Styling */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(75, 63, 114, 0.4);
        backdrop-filter: blur(4px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 100;
    }

    .modal-content {
        background-color: white;
        width: 100%;
        max-width: 480px;
        padding: 28px;
        border-radius: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 20px 40px rgba(75,63,114,0.15);
    }

    .modal-content h3 {
        color: #4B3F72;
        font-size: 18px;
        font-weight: 700;
    }

    .modal-content textarea {
        width: 100%;
        height: 90px;
        border: 1px solid #B89AE8;
        border-radius: 12px;
        padding: 12px;
        outline: none;
        resize: none;
        font-size: 14px;
        font-family: inherit;
        color: #4B3F72;
    }

    .media-upload-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .media-upload-label {
        font-size: 13px;
        font-weight: 600;
        color: #7A6F9B;
    }

    .upload-media-btn {
        background-color: #F7F5FC;
        color: #4B3F72;
        border: 2px dashed #B89AE8;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
    }

    .upload-media-btn:hover {
        background-color: #EBE5F5;
    }

    .media-preview-container {
        position: relative;
        width: 100%;
        max-height: 140px;
        border-radius: 10px;
        overflow: hidden;
        display: none;
    }

    .media-preview-container img {
        width: 100%;
        max-height: 140px;
        object-fit: cover;
    }

    .remove-preview-btn {
        position: absolute;
        top: 6px;
        right: 6px;
        background: rgba(0,0,0,0.6);
        color: white;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        font-size: 12px;
        cursor: pointer;
    }

    .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }

    .modal-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
    }

    .btn-submit {
        background-color: #4B3F72;
        color: white;
    }

    .btn-cancel {
        background-color: #F7F5FC;
        color: #7A6F9B;
    }

    @media (max-width: 900px) {
        .community-layout {
            grid-template-columns: 1fr;
        }
        .profile-card {
            position: static;
        }
    }
    </style>
</head>

<body>

    <!-- Unified Fixed Top Navigation Bar -->
    <header class="navbar">
        <div class="brand-logo">
            <img src="lfplogo.png" alt="Lumen Fret Path Logo">
        </div>
        <nav class="nav-center-pill">
            <a href="dashboard.html" class="nav-link" data-index="0">Dashboard</a>
            <a href="lesson.html" class="nav-link" data-index="1">Lessons</a>
            <a href="quiz.html" class="nav-link" data-index="2">Quizzes</a>
         
            <a href="community.html" class="nav-link active" data-index="4">Community</a>
        </nav>
        <div class="nav-right">
            <button class="action-btn" id="openModalBtn">
                ✨ Create Post
            </button>
            <button class="action-btn" id="msgToggleBtn" style="background: #EBE5F5; color: #4B3F72;">
                💬 Messages
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <div class="community-layout">
            
            <!-- Left Profile Card Sidebar -->
            <div class="profile-card">
                <div class="profile-picture" id="pfpContainer">
                    <span id="pfpText">Upload PFP</span>
                    <img id="pfpImage" style="display: none;" alt="Profile Picture">
                </div>
                <input type="file" id="pfpInput" accept="image/*" style="display: none;">

                <input type="text" class="profile-name" id="userName" readonly>
                
                <div class="profile-bio-container">
                    <p class="profile-bio" id="bioDisplay">Add a brief bio...</p>
                    <textarea class="profile-bio-input" id="bioInput" placeholder="Describe yourself..."></textarea>
                    <button class="bio-btn" id="bioBtn">Edit Bio</button>
                </div>
            </div>

            <!-- Right Community Feed Area -->
            <div class="feed-container">
                <div class="feed-controls">
                    <div class="search-bar">
                        <span class="search-bar-icon"></span>
                        <input type="text" id="searchInput" placeholder="Search community posts...">
                    </div>
                </div>

                <div class="posts" id="postsContainer">
                    <!-- Dynamic posts injected here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Floating Messenger Widget -->
    <div class="messenger-widget" id="messengerWidget" style="display: none;">
        <div class="messenger-header">
            <span id="messageTitle">Messages</span>
            <div class="messenger-header-actions">
                <span id="fullscreenMsgBtn" title="Toggle Fullscreen">⛶</span>
                <span id="closeMsgBtn">✕</span>
            </div>
        </div>

        <div class="users-list" id="usersList">
            <p class="users-loading">Loading users...</p>
        </div>

        <div class="messenger-body" id="msgBody"></div>

        <div class="messenger-input-area">
            <input type="text" id="msgInput" placeholder="Select a user first..." disabled>
            <button id="sendMsgBtn" disabled>Send</button>
        </div>
    </div>

    <!-- Create Post Modal with Media/Video Picture Upload -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-content">
            <h3>Create a New Post</h3>
            <textarea id="postCaptionInput" placeholder="What's on your mind or share a video update?"></textarea>
            
            <div class="media-upload-section">
                <span class="media-upload-label">Attach Video Thumbnail / Picture (Optional)</span>
                <div class="upload-media-btn" id="uploadMediaTriggerBtn">📷 Upload Image/Video Picture</div>
                <input type="file" id="postMediaInput" accept="image/*" style="display: none;">
                
                <div class="media-preview-container" id="mediaPreviewContainer">
                    <img id="mediaPreviewImage" alt="Media Preview">
                    <button class="remove-preview-btn" id="removePreviewBtn">✕</button>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" id="closeModalBtn">Cancel</button>
                <button class="modal-btn btn-submit" id="submitPostBtn">Post</button>
            </div>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { 
    getFirestore, 
    collection, 
    getDocs, 
    addDoc, 
    deleteDoc,
    doc,
    query, 
    orderBy, 
    onSnapshot, 
    serverTimestamp 
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAN7QOLIIz_E47yKvdsneq1MATe4_a92vE",
    authDomain: "lfp2-e5f32.firebaseapp.com",
    projectId: "lfp2-e5f32",
    storageBucket: "lfp2-e5f32.firebasestorage.app",
    messagingSenderId: "441259212354",
    appId: "1:441259212354:web:cb6832265e4bbbfea1f7db"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const userNameInput = document.getElementById("userName");
const messengerWidget = document.getElementById('messengerWidget');
const msgToggleBtn = document.getElementById('msgToggleBtn');
const closeMsgBtn = document.getElementById('closeMsgBtn');
const fullscreenMsgBtn = document.getElementById('fullscreenMsgBtn');
const sendMsgBtn = document.getElementById('sendMsgBtn');
const msgInput = document.getElementById('msgInput');
const msgBody = document.getElementById('msgBody');

let currentUserId = null;
let selectedUserId = null;
let unsubscribeMessages = null;
let uploadedMediaBase64 = null; // Store base64 media string for post attachment

// Page Transition Logic
const pageOrder = {
    'dashboard.html': 0,
    'lesson.html': 1,
    'quiz.html': 2,
    'vid.html': 3,
    'community.html': 4,
    'login.html': 5
};

window.addEventListener('pageshow', () => {
    const mainContent = document.querySelector('.main-content');
    const currentPage = window.location.pathname.split('/').pop() || 'community.html';
    const currentIndex = pageOrder[currentPage] !== undefined ? pageOrder[currentPage] : 4;
    const prevIndex = parseInt(sessionStorage.getItem('lastPageIndex')) || 0;

    mainContent.classList.remove('slide-left-out', 'slide-right-out');
    if (currentIndex > prevIndex) mainContent.classList.add('slide-left-in');
    else if (currentIndex < prevIndex) mainContent.classList.add('slide-right-in');

    requestAnimationFrame(() => {
        mainContent.classList.remove('slide-left-in', 'slide-right-in');
        mainContent.classList.add('page-loaded');
    });

    sessionStorage.setItem('lastPageIndex', currentIndex);
});

document.querySelectorAll('.nav-link').forEach(anchor => {
    anchor.addEventListener('click', function(e) {
        const targetUrl = this.getAttribute('href');
        if (targetUrl && !targetUrl.startsWith('#')) {
            const targetPage = targetUrl.split('/').pop();
            const currentPage = window.location.pathname.split('/').pop() || 'community.html';
            const currentIndex = pageOrder[currentPage] !== undefined ? pageOrder[currentPage] : 4;
            const targetIndex = pageOrder[targetPage] !== undefined ? pageOrder[targetPage] : 0;

            e.preventDefault();
            const mainContent = document.querySelector('.main-content');
            mainContent.classList.remove('page-loaded');

            if (targetIndex > currentIndex) mainContent.classList.add('slide-left-out');
            else mainContent.classList.add('slide-right-out');

            setTimeout(() => { window.location.href = targetUrl; }, 280);
        }
    });
});

function removePopovers() {
    document.querySelectorAll('.msg-popover').forEach(el => el.remove());
}

document.addEventListener('click', (e) => {
    if (!e.target.classList.contains('msg-bubble')) removePopovers();
});

function displayUserMessages(currentUserId, targetUserId) {
    if (unsubscribeMessages) unsubscribeMessages();

    const messagesRef = collection(db, "messages");
    const q = query(messagesRef, orderBy("timestamp", "asc"));

    unsubscribeMessages = onSnapshot(q, (snapshot) => {
        msgBody.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const msg = docSnap.data();
            const msgId = docSnap.id;

            const isBetweenUsers = 
                (msg.senderId === currentUserId && msg.receiverId === targetUserId) ||
                (msg.senderId === targetUserId && msg.receiverId === currentUserId);

            if (isBetweenUsers) {
                const wrapper = document.createElement("div");
                const isOutgoing = msg.senderId === currentUserId;
                wrapper.className = `msg-wrapper ${isOutgoing ? "msg-outgoing" : "msg-incoming"}`;

                const bubble = document.createElement("div");
                bubble.className = "msg-bubble";
                bubble.textContent = msg.text;

                if (isOutgoing) {
                    bubble.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removePopovers();
                        const popover = document.createElement('div');
                        popover.className = 'msg-popover';

                        const unsendBtn = document.createElement('button');
                        unsendBtn.textContent = 'Unsend Message';
                        unsendBtn.addEventListener('click', async () => {
                            try { await deleteDoc(doc(db, "messages", msgId)); } catch (err) { console.error(err); }
                        });

                        popover.appendChild(unsendBtn);
                        wrapper.appendChild(popover);
                    });
                }

                wrapper.appendChild(bubble);
                msgBody.appendChild(wrapper);
            }
        });
        msgBody.scrollTop = msgBody.scrollHeight;
    });
}

async function loadUsers(loggedInUid) {
    const usersListEl = document.getElementById("usersList");
    if (!usersListEl) return;

    try {
        const querySnapshot = await getDocs(collection(db, "users"));
        usersListEl.innerHTML = "";

        if (querySnapshot.empty) {
            usersListEl.innerHTML = '<p class="users-loading">No users found.</p>';
            return;
        }

        querySnapshot.forEach((docSnap) => {
            if (docSnap.id === loggedInUid) return;

            const userData = docSnap.data();
            const displayName = userData.displayName || userData.name || userData.username || userData.email || "User";

            const userItem = document.createElement("div");
            userItem.className = "user-item";
            userItem.textContent = displayName;

            userItem.addEventListener("click", () => {
                document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active-user"));
                userItem.classList.add("active-user");

                selectedUserId = docSnap.id;
                document.getElementById("messageTitle").textContent = displayName;

                msgInput.disabled = false;
                sendMsgBtn.disabled = false;
                msgInput.placeholder = `Message ${displayName}...`;

                displayUserMessages(currentUserId, selectedUserId);
            });

            usersListEl.appendChild(userItem);
        });
    } catch (error) {
        console.error("Error loading users:", error);
    }
}

let authChecked = false;

onAuthStateChanged(auth, (user) => {
    authChecked = true;
    if (user) {
        currentUserId = user.uid;
        const emailName = user.email.split("@")[0];
        const displayName = emailName.charAt(0).toUpperCase() + emailName.slice(1);
        if (userNameInput) userNameInput.value = displayName;

        loadSavedProfile(currentUserId);
        loadUsers(currentUserId);
        listenForPosts();
    } else {
        setTimeout(() => {
            if (!auth.currentUser && !authChecked) window.location.href = "login.html";
        }, 1500);
    }
});

function loadSavedProfile(uid) {
    const savedBio = localStorage.getItem(`lfp_bio_${uid}`);
    const savedPfp = localStorage.getItem(`lfp_pfp_${uid}`);

    if (savedBio && bioDisplay) bioDisplay.textContent = savedBio;
    if (savedPfp && pfpImage && pfpText) {
        pfpImage.src = savedPfp;
        pfpImage.style.display = 'block';
        pfpText.style.display = 'none';
    }
}

async function handleSendMessage() {
    const text = msgInput.value.trim();
    if (text && selectedUserId && currentUserId) {
        try {
            msgInput.value = "";
            await addDoc(collection(db, "messages"), {
                senderId: currentUserId,
                receiverId: selectedUserId,
                text: text,
                timestamp: serverTimestamp()
            });
        } catch (error) {
            console.error(error);
        }
    }
}

if (sendMsgBtn) sendMsgBtn.addEventListener("click", handleSendMessage);
if (msgInput) msgInput.addEventListener("keypress", (e) => { if (e.key === "Enter") handleSendMessage(); });

// Real-time Community Posts Listener & Rendering Delete Button
function listenForPosts() {
    const postsContainer = document.getElementById('postsContainer');
    if (!postsContainer) return;

    const postsRef = collection(db, "posts");
    const q = query(postsRef, orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        postsContainer.innerHTML = "";

        snapshot.forEach((docSnap) => {
            const post = docSnap.data();
            const postId = docSnap.id;

            const postBox = document.createElement('div');
            postBox.className = 'post-box';

            const isAuthor = post.authorId === currentUserId;

            postBox.innerHTML = `
                <div class="post-header">
                    <div class="post-author">
                        <div class="post-author-avatar"></div>
                        <span class="post-author-name">${post.authorName || "User"}</span>
                    </div>
                    ${isAuthor ? `<button class="delete-post-btn" data-id="${postId}">Delete Post</button>` : ''}
                </div>
                ${post.caption ? `<div class="post-caption">${post.caption}</div>` : ''}
                ${post.mediaUrl ? `
                    <div class="post-media-container">
                        <img src="${post.mediaUrl}" alt="Post Attachment">
                    </div>
                ` : ''}
            `;

            if (isAuthor) {
                postBox.querySelector('.delete-post-btn').addEventListener('click', async () => {
                    if (confirm("Are you sure you want to delete this post?")) {
                        try {
                            await deleteDoc(doc(db, "posts", postId));
                        } catch (err) {
                            console.error("Error deleting post:", err);
                        }
                    }
                });
            }

            postsContainer.appendChild(postBox);
        });
    });
}

// Modal handling & Media upload logic
const openModalBtn = document.getElementById('openModalBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const postModal = document.getElementById('postModal');
const submitPostBtn = document.getElementById('submitPostBtn');
const postCaptionInput = document.getElementById('postCaptionInput');
const postMediaInput = document.getElementById('postMediaInput');
const uploadMediaTriggerBtn = document.getElementById('uploadMediaTriggerBtn');
const mediaPreviewContainer = document.getElementById('mediaPreviewContainer');
const mediaPreviewImage = document.getElementById('mediaPreviewImage');
const removePreviewBtn = document.getElementById('removePreviewBtn');

if (openModalBtn && postModal) {
    openModalBtn.addEventListener('click', () => { postModal.style.display = 'flex'; });
    if (closeModalBtn) closeModalBtn.addEventListener('click', () => { postModal.style.display = 'none'; });

    uploadMediaTriggerBtn.addEventListener('click', () => postMediaInput.click());

    postMediaInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                uploadedMediaBase64 = uploadEvent.target.result;
                mediaPreviewImage.src = uploadedMediaBase64;
                mediaPreviewContainer.style.display = 'block';
                uploadMediaTriggerBtn.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    removePreviewBtn.addEventListener('click', () => {
        uploadedMediaBase64 = null;
        postMediaInput.value = '';
        mediaPreviewContainer.style.display = 'none';
        uploadMediaTriggerBtn.style.display = 'block';
    });

    if (submitPostBtn) {
        submitPostBtn.addEventListener('click', async () => {
            const captionText = postCaptionInput ? postCaptionInput.value.trim() : "";
            const userName = userNameInput ? userNameInput.value : "User";

            if (!captionText && !uploadedMediaBase64) {
                alert("Please add text or attach a picture to post.");
                return;
            }

            try {
                const postData = {
                    authorId: currentUserId,
                    authorName: userName,
                    caption: captionText,
                    timestamp: serverTimestamp()
                };

                if (uploadedMediaBase64) {
                    postData.mediaUrl = uploadedMediaBase64;
                }

                await addDoc(collection(db, "posts"), postData);

                // Reset modal state
                if (postCaptionInput) postCaptionInput.value = '';
                uploadedMediaBase64 = null;
                postMediaInput.value = '';
                mediaPreviewContainer.style.display = 'none';
                uploadMediaTriggerBtn.style.display = 'block';
                postModal.style.display = 'none';
            } catch (error) {
                console.error("Error creating post:", error);
            }
        });
    }
}

// Profile Picture & Bio handling
const pfpContainer = document.getElementById('pfpContainer');
const pfpInput = document.getElementById('pfpInput');
const pfpImage = document.getElementById('pfpImage');
const pfpText = document.getElementById('pfpText');

if (pfpContainer && pfpInput) {
    pfpContainer.addEventListener('click', () => pfpInput.click());
    pfpInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                const base64Image = uploadEvent.target.result;
                if (pfpImage) {
                    pfpImage.src = base64Image;
                    pfpImage.style.display = 'block';
                }
                if (pfpText) pfpText.style.display = 'none';
                if (currentUserId) localStorage.setItem(`lfp_pfp_${currentUserId}`, base64Image);
            };
            reader.readAsDataURL(file);
        }
    });
}

const bioDisplay = document.getElementById('bioDisplay');
const bioInput = document.getElementById('bioInput');
const bioBtn = document.getElementById('bioBtn');

if (bioBtn && bioDisplay && bioInput) {
    bioBtn.addEventListener('click', () => {
        if (bioInput.style.display === 'none' || bioInput.style.display === '') {
            bioInput.value = bioDisplay.textContent === 'Add a brief bio...' ? '' : bioDisplay.textContent;
            bioInput.style.display = 'block';
            bioDisplay.style.display = 'none';
            bioBtn.textContent = 'Save Bio';
        } else {
            const text = bioInput.value.trim();
            const finalBio = text ? text : 'Add a brief bio...';
            bioDisplay.textContent = finalBio;
            bioInput.style.display = 'none';
            bioDisplay.style.display = 'block';
            bioBtn.textContent = 'Edit Bio';
            if (currentUserId) localStorage.setItem(`lfp_bio_${currentUserId}`, finalBio);
        }
    });
}

const searchInput = document.getElementById('searchInput');
if (searchInput) {
    searchInput.addEventListener('input', () => {
        const queryStr = searchInput.value.toLowerCase().trim();
        document.querySelectorAll('.post-box').forEach(post => {
            const caption = post.querySelector('.post-caption')?.textContent.toLowerCase() || '';
            const author = post.querySelector('.post-author-name')?.textContent.toLowerCase() || '';
            post.style.display = (caption.includes(queryStr) || author.includes(queryStr)) ? '' : 'none';
        });
    });
}

if (msgToggleBtn && messengerWidget) {
    msgToggleBtn.addEventListener('click', () => {
        messengerWidget.style.display = messengerWidget.style.display === 'none' ? 'flex' : 'none';
    });
}
if (closeMsgBtn && messengerWidget) closeModalBtn.addEventListener('click', () => { messengerWidget.style.display = 'none'; });
if (fullscreenMsgBtn && messengerWidget) fullscreenMsgBtn.addEventListener('click', () => { messengerWidget.classList.toggle('fullscreen'); });
</script>
</body>
