<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumen Fret Path - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F7F5FC;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #4B3F72;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Splash Screen Setup */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            opacity: 1;
            transition: opacity 0.8s ease-in-out;
            background-color: #F7F5FC;
            z-index: 999;
        }

        #splash-screen img {
            width: 500px;
            max-width: 80%;
            height: auto;
        }

        /* Main Login Section */
        #login-screen {
            display: flex;
            width: 100%;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            gap: 60px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease-in-out, transform 0.4s ease;
            position: relative;
        }

        .slide-left-out {
            transform: translateX(-100px);
            opacity: 0 !important;
        }

        .logo-section {
            width: 400px;
            max-width: 40%;
            z-index: 2;
        }

        .logo-section img {
            width: 100%;
            height: auto;
            display: block;
        }

        .login-box {
            width: 440px;
            background-color: #ffffff;
            border: 1px solid #B89AE8;
            box-shadow: 0 10px 25px rgba(75, 63, 114, 0.08);
            border-radius: 24px;
            padding: 45px 40px;
            z-index: 2;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 24px;
            color: #4B3F72;
            text-align: left;
        }

        .login-box label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #4B3F72;
        }

        .login-box input {
            width: 100%;
            height: 48px;
            border: 1px solid #B89AE8;
            outline: none;
            background-color: #F7F5FC;
            border-radius: 12px;
            padding: 0 16px;
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 15px;
            color: #4B3F72;
            transition: all 0.2s;
        }

        .login-box input:focus {
            border-color: #4B3F72;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(184, 154, 232, 0.3);
        }

        .password-container {
            position: relative;
        }

        .password-container input {
            width: 100%;
            padding-right: 45px;
        }

        #toggle-password {
            position: absolute;
            right: 15px;
            top: 15px;
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            color: #B89AE8;
        }

        .forgot {
            display: block;
            color: #4B3F72;
            text-decoration: none;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .forgot:hover {
            text-decoration: underline;
            color: #B89AE8;
        }

        .login-box button[type="submit"] {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 12px;
            background-color: #4B3F72;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s;
        }

        .login-box button[type="submit"]:hover {
            background-color: #B89AE8;
        }

        .login-box button.signup {
            width: 100%;
            height: 48px;
            border: 1px solid #78C9A3;
            border-radius: 12px;
            background-color: #78C9A3;
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 12px;
            transition: background-color 0.2s, color 0.2s;
        }

        .login-box button.signup:hover {
            background-color: #F4C95D;
            border-color: #F4C95D;
            color: #4B3F72;
        }

        /* Decorative Music Notes */
        .note {
            position: fixed;
            color: #78C9A3;
            font-family: Georgia, serif;
            font-size: 38px;
            user-select: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            z-index: 1;
        }

        .note1 { top: 160px; left: 30px; transform: rotate(-15deg); color: #78C9A3; }
        .note2 { top: 90px; left: 47%; transform: rotate(8deg); color: #F4C95D; }
        .note3 { bottom: 100px; left: 17%; transform: rotate(10deg); color: #B89AE8; }
        .note4 { bottom: 105px; left: 43%; transform: rotate(-20deg); color: #78C9A3; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="lfplogo.png" alt="Lumen Fret Path Logo">
    </div>

    <div id="login-screen">
        <div class="note note1">♫</div>
        <div class="note note2">♪</div>
        <div class="note note3">♫</div>
        <div class="note note4">♪</div>

        <div class="logo-section">
            <img src="lfplogo.png" alt="Lumen Fret Path Logo">
        </div>

        <div class="login-box">
            <h1>Welcome Back</h1>
            
            <form id="login-form">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required placeholder="Enter your email">

                <label for="password">Password</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                    <span id="toggle-password">👁</span>
                </div>

                <a href="#" class="forgot" id="forgot-password">Forgot your password?</a>

                <button type="submit">Login</button>
                <button type="button" class="signup" id="signup-btn">Sign up</button>
            </form>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import {
    getFirestore,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAN7QOLIIz_E47yKvdsneq1MATe4_a92vE",
    authDomain: "lfp2-e5f32.firebaseapp.com",
    projectId: "lfp2-e5f32",
    storageBucket: "lfp2-e5f32.firebasestorage.app",
    messagingSenderId: "441259212354",
    appId: "1:441259212354:web:cb6832265e4bbbfea1f7db",
    measurementId: "G-L3TXJ2Q75N"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginForm = document.getElementById("login-form");
const signupButton = document.getElementById("signup-btn");
const emailInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const forgotPassword = document.getElementById("forgot-password");

// Splash Screen transition setup
window.addEventListener('DOMContentLoaded', () => {
    const splashScreen = document.getElementById('splash-screen');
    const loginScreen = document.getElementById('login-screen');
    const notes = document.querySelectorAll('.note');

    setTimeout(() => {
        splashScreen.style.opacity = '0';

        setTimeout(() => {
            splashScreen.style.display = 'none';
            loginScreen.style.opacity = '1';
            loginScreen.style.pointerEvents = 'auto';

            notes.forEach(note => {
                note.style.opacity = '1';
            });
        }, 800);
    }, 2000);
});

// Authentication listener (ensures proper session validation before redirecting)
onAuthStateChanged(auth, (user) => {
    const isLoggedIn = localStorage.getItem("isLoggedIn");
    if (user && isLoggedIn === "true") {
        if (window.location.pathname.includes("login.html") || window.location.pathname.endsWith("/")) {
            window.location.href = "dashboard.html";
        }
    } else {
        localStorage.removeItem("isLoggedIn");
    }
});

// Custom Modal Notification
function showNotification(message) {
    const existingOverlay = document.getElementById("custom-notification-overlay");
    if (existingOverlay) {
        existingOverlay.remove();
    }

    const overlay = document.createElement("div");
    overlay.id = "custom-notification-overlay";
    overlay.style.position = "fixed";
    overlay.style.top = "0";
    overlay.style.left = "0";
    overlay.style.width = "100%";
    overlay.style.height = "100%";
    overlay.style.backgroundColor = "rgba(75, 63, 114, 0.4)";
    overlay.style.display = "flex";
    overlay.style.alignItems = "center";
    overlay.style.justifyContent = "center";
    overlay.style.zIndex = "9999";

    const box = document.createElement("div");
    box.style.backgroundColor = "#ffffff";
    box.style.padding = "30px 40px";
    box.style.borderRadius = "20px";
    box.style.boxShadow = "0 15px 30px rgba(75, 63, 114, 0.2)";
    box.style.textAlign = "center";
    box.style.maxWidth = "400px";
    box.style.width = "90%";

    const text = document.createElement("p");
    text.textContent = message;
    text.style.fontSize = "16px";
    text.style.color = "#4B3F72";
    text.style.marginBottom = "20px";
    text.style.fontWeight = "500";

    const button = document.createElement("button");
    button.textContent = "OK";
    button.style.backgroundColor = "#4B3F72";
    button.style.color = "#ffffff";
    button.style.border = "none";
    button.style.padding = "10px 25px";
    button.style.borderRadius = "10px";
    button.style.fontSize = "14px";
    button.style.fontWeight = "bold";
    button.style.cursor = "pointer";

    button.addEventListener("click", () => {
        overlay.remove();
    });

    box.appendChild(text);
    box.appendChild(button);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
}

// Sign Up Handler
signupButton.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
        showNotification("Please fill in both email and password fields.");
        return;
    }

    try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const emailName = email.split("@")[0];
        const displayName = emailName.charAt(0).toUpperCase() + emailName.slice(1);
        
        await setDoc(doc(db, "users", user.uid), {
            name: displayName,
            email: email,
            uid: user.uid
        });

        localStorage.setItem("isLoggedIn", "true");
        showNotification("Account created successfully!");
        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1000);
    } catch (error) {
        showNotification(error.message);
    }
});

// Login Handler
loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const emailName = email.split("@")[0];
        const displayName = emailName.charAt(0).toUpperCase() + emailName.slice(1);
        
        await setDoc(doc(db, "users", user.uid), {
            name: displayName,
            email: email,
            uid: user.uid
        }, { merge: true });

        localStorage.setItem("isLoggedIn", "true");

        const mainContent = document.getElementById('login-screen');
        mainContent.classList.add('slide-left-out');

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 350);

    } catch (error) {
        showNotification(error.message);
    }
});

// Toggle Password Visibility
const togglePassword = document.getElementById("toggle-password");
togglePassword.addEventListener("click", () => {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "⊘";
    } else {
        passwordInput.type = "password";
        togglePassword.textContent = "👁";
    }
});

// Forgot Password Handler
forgotPassword.addEventListener("click", async (event) => {
    event.preventDefault();
    const email = emailInput.value.trim();

    if (email === "") {
        showNotification("Please enter your email first.");
        return;
    }

    try {
        await sendPasswordResetEmail(auth, email);
        showNotification("Password reset email sent! Please check your inbox.");
    } catch (error) {
        showNotification(error.message);
    }
});
</script>
</body>
</html>
